<!-- index.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16202e">
  <title>Carburants Lyon – prix en direct</title>
  <meta name="description" content="Carte des prix des carburants autour de Lyon, mis à jour toutes les 10 minutes.">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1 class="sr-only">Carburants Lyon : prix en direct</h1>

  <div id="map" role="application" aria-label="Carte des stations-service"></div>

  <p id="status" class="status-chip" role="status" aria-live="polite">Chargement des prix…</p>

  <nav class="bottom-bar" aria-label="Actions">
    <button id="list-btn" class="pill" type="button">
      LISTE
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M3 6h18M3 12h12M3 18h7"/></svg>
    </button>
    <button id="filters-btn" class="pill" type="button">
      FILTRES
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg>
    </button>
  </nav>

  <button id="locate-btn" class="round-btn" type="button" aria-label="Autour de moi">
    <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M3 11l18-8-8 18-2-8z"/></svg>
  </button>

  <section id="sheet" class="sheet" aria-labelledby="sheet-title" hidden>
    <div class="sheet-header">
      <h2 id="sheet-title"></h2>
      <button id="sheet-close" class="sheet-close" type="button" aria-label="Fermer">✕</button>
    </div>
    <div id="sheet-body" class="sheet-body"></div>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
